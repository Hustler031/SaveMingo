name: SaveMingo CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "chatgpt/**"
      - "codex/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Reddit mux dependencies
        working-directory: services/reddit-mux
        run: npm install

      - name: Verify Reddit mux FFmpeg
        working-directory: services/reddit-mux
        run: node --input-type=module -e "import ffmpeg from 'ffmpeg-static'; import { spawnSync } from 'node:child_process'; const result = spawnSync(ffmpeg, ['-version'], { stdio: 'inherit' }); process.exit(result.status ?? 1);"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build Next.js fallback
        run: npm run build

      - name: Build Cloudflare Worker
        run: npm run build:vinext
