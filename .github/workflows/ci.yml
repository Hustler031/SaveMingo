name: SaveMingo CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "chatgpt/**"
      - "codex/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build Next.js fallback
        run: npm run build

      - name: Build Cloudflare Worker
        run: npm run build:vinext
